name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la ejecución anterior: no tiene sentido
# terminar de verificar un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lo que ya existía y nadie ejecutaba automáticamente ────────────────────────
  verify:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # La versión sale del campo packageManager de package.json.

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sin secretos JWT a propósito: compilar no los necesita. `verifyToken` los lee en
      # cada petición y `requireSecret()` corre al arrancar la API, no al construirla.
      # Si algún día hicieran falta aquí, sería la señal de que algo se evalúa demasiado pronto.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # ─── El hueco que no cubría nada: guards, controladores y migraciones reales ────
  integration:
    name: Integración contra Postgres
    runs-on: ubuntu-latest

    services:
      # Solo Postgres. Redis no hace falta: está declarado en la configuración pero
      # ningún módulo del backend abre una conexión.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loklflow
          POSTGRES_PASSWORD: loklflow
          POSTGRES_DB: loklflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loklflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # NODE_ENV=test y no development: con development se activaría `synchronize` y el
      # esquema lo crearía TypeORM en vez de las migraciones, que es justo lo que se quiere
      # comprobar. El arranque de la suite redirige la base a loklflow_test.
      DATABASE_URL: postgresql://loklflow:loklflow@localhost:5432/loklflow_db
      DATABASE_SSL: 'false'

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Secretos de un solo uso: la API se niega a arrancar si faltan o si conservan el
      # valor de ejemplo "change-this-*".
      - name: Generar secretos JWT para esta ejecución
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - run: pnpm --filter=api test:int

  # ─── Que las imágenes se construyan y arranquen de verdad ───────────────────────
  images:
    name: Imágenes de Docker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loklflow
          POSTGRES_PASSWORD: loklflow
          POSTGRES_DB: loklflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loklflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # No se publican en ningún registro: el objetivo es que el repo esté siempre listo
      # para desplegar, no desplegar. `load: true` las deja en el docker local del runner
      # para poder arrancarlas en el paso siguiente.
      - name: Construir la imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: loklflow-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Construir la imagen del web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
          tags: loklflow-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Que compile no prueba que arranque. Esto detecta lo que el build no ve: rutas mal
      # copiadas, dependencias que faltaban en producción o migraciones que no aplican.
      - name: Migraciones y seed desde la imagen, contra una base vacía
        run: |
          docker run --rm --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://loklflow:loklflow@localhost:5432/loklflow_db \
            loklflow-api:ci pnpm migration:run:prod
          docker run --rm --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://loklflow:loklflow@localhost:5432/loklflow_db \
            loklflow-api:ci pnpm seed:prod

      - name: Arrancar la API y comprobar /api/health
        run: |
          docker run -d --name api --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://loklflow:loklflow@localhost:5432/loklflow_db \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e JWT_REFRESH_SECRET="$(openssl rand -base64 48)" \
            loklflow-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health > /dev/null; then
              echo "API arriba"; break
            fi
            if [ "$i" = "30" ]; then
              echo "La API no respondió en 30 intentos:"; docker logs api; exit 1
            fi
            sleep 2
          done
          # Una ruta protegida tiene que seguir exigiendo sesión: si esto devolviera 200,
          # los guards globales no estarían registrados en la imagen.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/orders)
          test "$code" = "401" || { echo "GET /api/orders devolvió $code, se esperaba 401"; exit 1; }

      # ─── Que la observabilidad exista de verdad, no solo en el código ────────────
      # Todo lo de abajo se comprueba sobre la imagen en marcha, porque son cosas que el
      # build no puede ver: el formato del log depende de NODE_ENV, la cabecera depende de un
      # middleware registrado, y /api/ready depende de que haya una base al otro lado.
      - name: El id de petición viaja en la cabecera y en el cuerpo del error
        run: |
          id=$(curl -s -o /dev/null -D - http://localhost:3001/api/health \
               | tr -d '\r' | awk 'tolower($1)=="x-request-id:"{print $2}')
          test -n "$id" || { echo "Ninguna respuesta trajo x-request-id"; exit 1; }
          echo "x-request-id: $id"
          # El mismo id tiene que ir en el cuerpo del error, que es lo que ve el operario en
          # pantalla y lo único que permite localizar la traza en el servidor.
          body=$(curl -s http://localhost:3001/api/orders)
          echo "$body" | jq -e '.requestId | strings' > /dev/null \
            || { echo "El 401 no llevó requestId en el cuerpo: $body"; exit 1; }
          # Y un id de fuera con forma válida se respeta, para poder seguir una llamada.
          echoed=$(curl -s -o /dev/null -D - -H 'x-request-id: ci-trace-0001' \
                   http://localhost:3001/api/health | tr -d '\r' \
                   | awk 'tolower($1)=="x-request-id:"{print $2}')
          test "$echoed" = "ci-trace-0001" \
            || { echo "No se respetó el id entrante: $echoed"; exit 1; }

      - name: Cada línea de log es un JSON parseable
        run: |
          # Con NODE_ENV=production el logger escribe JSON compacto, una línea por registro.
          # Si alguien devuelve el formato con colores, o escribe por su cuenta en stdout
          # saltándose el logger, la salida deja de poder agregarse y esto lo detecta.
          docker logs api > /tmp/api.log 2>&1
          test -s /tmp/api.log || { echo "La API no escribió ni una línea de log"; exit 1; }
          bad=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            printf '%s' "$line" | jq -e 'type == "object" and has("level")' > /dev/null 2>&1 \
              || { echo "No es JSON: $line"; bad=1; }
          done < /tmp/api.log
          test "$bad" = "0" || exit 1
          echo "$(wc -l < /tmp/api.log) líneas, todas JSON"

      - name: Con Postgres parado, /api/ready falla y /api/health no
        run: |
          # Se para el contenedor del servicio: es el último paso del job, así que no rompe
          # nada posterior. La distinción es el motivo de que /api/ready exista aparte —el
          # HEALTHCHECK de la imagen mira /api/health y no debe reiniciar un proceso sano
          # por un parpadeo de la base.
          docker stop "$(docker ps -q --filter ancestor=postgres:16-alpine)"
          # La comprobación se cachea unos segundos para que un endpoint público no dispare
          # un SELECT por petición; hay que esperar a que caduque.
          sleep 8

          ready=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/ready)
          test "$ready" = "503" || { echo "/api/ready devolvió $ready con la base parada"; exit 1; }

          health=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/health)
          test "$health" = "200" || { echo "/api/health devolvió $health y debía seguir vivo"; exit 1; }

          # Y el 5xx tiene que haber dejado traza, con su id: sin esto el endpoint avisaría
          # de que algo va mal sin dejar nada que investigar.
          docker logs api 2>&1 | tail -50 > /tmp/api-fail.log
          grep -q '"level":"error"' /tmp/api-fail.log \
            || { echo "El 503 no dejó ninguna línea de error:"; cat /tmp/api-fail.log; exit 1; }
          grep -q '"requestId"' /tmp/api-fail.log \
            || { echo "La traza del 503 no lleva requestId:"; cat /tmp/api-fail.log; exit 1; }
          docker rm -f api

      - name: Arrancar el web y comprobar que sirve los assets
        run: |
          docker run -d --name web --network host \
            -e PORT=3000 \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            loklflow-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/login > /dev/null; then
              echo "Web arriba"; break
            fi
            if [ "$i" = "30" ]; then
              echo "El web no respondió en 30 intentos:"; docker logs web; exit 1
            fi
            sleep 2
          done
          # .next/static se copia en un paso aparte del Dockerfile porque la salida
          # standalone no lo incluye. Si ese COPY desapareciera, la página cargaría igual
          # pero sin estilos, y solo esto lo detecta.
          asset=$(curl -s http://localhost:3000/login | grep -oE '/_next/static/[^"]+\.css' | head -1)
          test -n "$asset" || { echo "No se encontró ningún CSS en /login"; exit 1; }
          curl -fsS "http://localhost:3000$asset" > /dev/null \
            || { echo "El asset $asset no se sirve: falta .next/static en la imagen"; exit 1; }
          docker rm -f web
